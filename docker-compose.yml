version: "3.9"
services:
  server1:
    build: .
    container_name: them-server-1
    ports:
      - "9292:9292"
    environment:
      HANAMI_PORT: 9292
      HANAMI_ENV: production
      GEM_SERVER_DB: /app/config/db/them_server_1.db
      FEDERATION_BASE_URL: http://server1:9292
    volumes:
      - ./config/db:/app/config/db
    command: >-
      sh -lc "ruby -e 'require \"./config/database\"; Gem::Server::Database.migrate' && bundle exec rackup -p 9292 -E production --host 0.0.0.0"

  server2:
    build: .
    container_name: them-server-2
    ports:
      - "9393:9393"
    environment:
      HANAMI_PORT: 9393
      HANAMI_ENV: production
      GEM_SERVER_DB: /app/config/db/them_server_2.db
      FEDERATION_BASE_URL: http://server2:9393
    volumes:
      - ./config/db:/app/config/db
    command: >-
      sh -lc "ruby -e 'require \"./config/database\"; Gem::Server::Database.migrate' && bundle exec rackup -p 9393 -E production --host 0.0.0.0"

  wire:
    build: .
    container_name: them-server-wire
    depends_on:
      - server1
      - server2
    environment:
      WIRE_WAIT: 5
    command: >-
      sh -lc "ruby docker/demo/wire.rb && echo 'Done wiring federation' && sleep 2"
